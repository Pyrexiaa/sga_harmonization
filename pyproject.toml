[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sga-harmonization"
version = "1.0.0"
description = "Unified feature-harmonization framework for small-for-gestational-age prediction across the Malaysian and Indian cohorts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jia Yu Lim" }, { name = "Shier Nee Saw" }]
keywords = [
    "small-for-gestational-age",
    "feature harmonization",
    "multi-centre clinical modelling",
    "machine learning",
    "risk stratification",
]
dependencies = [
    "numpy>=1.26,<2",
    "pandas>=2.2",
    "scipy>=1.15",
    "scikit-learn>=1.6",
    "catboost>=1.2",
    "torch>=2.6",
    "imbalanced-learn>=0.13",
    "statsmodels>=0.14",
    "shap>=0.46",
    "matplotlib>=3.10",
    "seaborn>=0.13",
    "openpyxl>=3.1",
    "XlsxWriter>=3.2",
    "PyYAML>=6.0",
    "joblib>=1.4",
]

[project.optional-dependencies]
extras = ["torchsampler>=0.1.2", "smogn>=0.1.2"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
# scripts/ and rebuttals/ are real packages (they carry __init__.py) and are
# invoked as `python -m scripts.01a_...` / `python -m rebuttals.round1....`,
# so a non-editable install must ship them too.
include = ["sga*", "scripts*", "rebuttals*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
