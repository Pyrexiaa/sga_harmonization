name: sga-harmonization
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy=1.26.4
  - pandas=2.2.3
  - scipy=1.15.2
  - scikit-learn=1.6.1
  - statsmodels=0.14.4
  - matplotlib=3.10.0
  - seaborn=0.13.2
  - openpyxl=3.1.5
  - xlsxwriter=3.2.2
  - pyyaml=6.0.2
  - joblib=1.4.2
  - pip:
      - torch==2.6.0
      - catboost==1.2.7
      - imbalanced-learn==0.13.0
      -       - shap==0.46.0
      # Optional extras, imported lazily:
      # - torchsampler==0.1.2
      # - smogn==0.1.2
